name: Check for new publications

on:
  schedule:
    - cron: "0 14 * * 1"   # Mondays 14:00 UTC (8-9 am in Houston)
  workflow_dispatch:        # "Run workflow" button in the Actions tab

permissions:
  contents: write
  issues: write

concurrency: new-publications

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Look for new papers on OpenAlex
        run: python3 scripts/update_publications.py

      - name: Put the suggestions on a branch and open an issue
        env:
          GH_TOKEN: ${{ github.token }}
          ASSIGNEES: cyyyyy111,hangyun0511   # GitHub accounts notified by email, comma-separated
        run: |
          if git diff --quiet -- _data/publications.yml; then
            echo "Nothing new this week."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -C new-publications
          git commit -m "Add new publications found on OpenAlex" -- _data/publications.yml
          git push --force origin new-publications

          gh label create new-publications --color C7542E --description "Weekly OpenAlex check" 2>/dev/null || true
          number=$(gh issue list --state open --label new-publications --json number --jq '.[0].number // empty')
          if [ -z "$number" ]; then
            number=$(gh issue create --title "New publications found on OpenAlex" --label new-publications \
              --assignee "$ASSIGNEES" --body "Checking..." | grep -o '[0-9]*$')
          fi
          link="https://github.com/${GITHUB_REPOSITORY}/compare/main...new-publications?expand=1&title=Add+new+publications&body=Closes+%23${number}"
          { echo "### [Review and publish them]($link)"; echo; cat new-publications.md; } > issue.md
          gh issue edit "$number" --body-file issue.md
