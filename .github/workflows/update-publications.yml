name: Update publications

on:
  schedule:
    - cron: "0 14 * * 1"   # Mondays 14:00 UTC (8-9 am in Houston)
  workflow_dispatch:        # "Run workflow" button in the Actions tab

permissions:
  contents: write
  pages: write

concurrency: update-publications

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Add new papers from OpenAlex
        run: python3 scripts/update_publications.py

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- _data/publications.yml; then
            echo "Nothing new this week."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Add new publications found on OpenAlex" -- _data/publications.yml _data/publications_added.yml
          git push origin HEAD:main
          # commits pushed by Actions don't start a Pages build on their own
          gh api -X POST "repos/${GITHUB_REPOSITORY}/pages/builds" > /dev/null
