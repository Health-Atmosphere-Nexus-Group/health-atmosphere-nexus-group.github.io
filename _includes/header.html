<header id="hdr">
  <div class="wrap hdr-in">
    <a class="logo" href="./"><img src="images/logos/uthealth-header.jpg" alt="UTHealth - The University of Texas Health Science Center at Houston"></a>
    <span class="vline"></span>
    <p class="site-title">{% include group-name.html %}</p>
    <button class="burger" type="button" aria-label="Menu"><span></span><span></span><span></span></button>
    <nav>
      <ul>
        {%- for item in site.data.navigation %}
        {%- assign href = item.url | remove_first: "/" %}
        {%- if href == "" %}{% assign href = "./" %}{% endif %}
        <li><a href="{{ href }}"{% if page.url == item.url %} class="active"{% endif %}>{{ item.title }}</a></li>
        {%- endfor %}
      </ul>
    </nav>
  </div>
</header>
